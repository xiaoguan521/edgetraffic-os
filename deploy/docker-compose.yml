# 开发 / 试用环境：控制台 + PostgreSQL
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: edgetraffic
      POSTGRES_USER: edgetraffic
      POSTGRES_PASSWORD: change-me-in-dev-only
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
  console:
    build: { context: .., dockerfile: deploy/Dockerfile.console }
    depends_on: [postgres]
    environment:
      ETOS_DB_DSN: postgres://edgetraffic:change-me-in-dev-only@postgres:5432/edgetraffic?sslmode=disable
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:9443:9443"]
volumes:
  pgdata: {}
