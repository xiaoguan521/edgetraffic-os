# syedge-console 软件包：控制台（Web 界面已内置）。签发工具 syedge-license-server 只给授权方使用，不随此包分发。
name: syedge-console
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: SyEdge <support@edgetraffic.invalid>
vendor: SyEdge
homepage: https://github.com/xiaoguan521/edgetraffic-os
license: Proprietary
description: |
  syedge-console: SyEdge console. Manages syedge edge nodes: sites, certificates, releases, audit and licensing.
contents:
  - src: ${STAGE}/console/syedge-console
    dst: /usr/bin/syedge-console
    file_info: { mode: 0755 }
  - src: ${STAGE}/console/syedge-console.service
    dst: /usr/lib/systemd/system/syedge-console.service
  - src: ${STAGE}/console/console.env
    dst: /etc/syedge-console/console.env
    type: config|noreplace
    file_info: { mode: 0640 }
  - src: ${STAGE}/console/NOTICE
    dst: /usr/share/doc/syedge-console/NOTICE
scripts:
  preinstall: ${STAGE}/scripts/console-preinstall.sh
  postinstall: ${STAGE}/scripts/console-postinstall.sh
  preremove: ${STAGE}/scripts/console-preremove.sh
