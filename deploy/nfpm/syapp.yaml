# syapp 数据面软件包（RPM / DEB）。由 scripts/release/package.sh pkg 调用 nfpm 生成。
name: syapp
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: EdgeTraffic OS <support@edgetraffic.invalid>
vendor: EdgeTraffic OS
homepage: https://github.com/xiaoguan521/edgetraffic-os
license: BSD-2-Clause
description: |
  syapp: EdgeTraffic OS edge data plane (static and dynamic web traffic proxy).
  Based on NGINX Open Source (BSD-2-Clause). Statically linked with OpenSSL, PCRE2 and zlib.
contents:
  - src: ${STAGE}/syapp/opt/syapp
    dst: /opt/syapp
    type: tree
  - src: /opt/syapp/sbin/syapp
    dst: /usr/sbin/syapp
    type: symlink
  - src: ${STAGE}/syapp/syapp.service
    dst: /usr/lib/systemd/system/syapp.service
  - src: ${STAGE}/syapp/syapp@.service
    dst: /usr/lib/systemd/system/syapp@.service
  - src: ${STAGE}/syapp/tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/syapp.conf
  - src: ${STAGE}/syapp/logrotate
    dst: /etc/logrotate.d/syapp
    type: config|noreplace
  - dst: /var/log/syapp
    type: dir
  - dst: /var/cache/syapp
    type: dir
scripts:
  preinstall: ${STAGE}/scripts/syapp-preinstall.sh
  postinstall: ${STAGE}/scripts/syapp-postinstall.sh
  preremove: ${STAGE}/scripts/syapp-preremove.sh
