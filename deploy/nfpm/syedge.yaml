# syedge 数据面软件包（RPM / DEB）。由 scripts/release/package.sh pkg 调用 nfpm 生成。
name: syedge
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: SyEdge <support@edgetraffic.invalid>
vendor: SyEdge
homepage: https://github.com/xiaoguan521/edgetraffic-os
license: BSD-2-Clause
description: |
  syedge: SyEdge edge data plane (static and dynamic web traffic proxy).
  Based on NGINX Open Source (BSD-2-Clause). Statically linked with OpenSSL, PCRE2 and zlib.
depends:
  - util-linux  # runuser：安装时检查运行用户权限，轮转日志时向 master 发信号
contents:
  - src: ${STAGE}/syedge/opt/syedge
    dst: /opt/syedge
    type: tree
  - src: /opt/syedge/sbin/syedge
    dst: /usr/sbin/syedge
    type: symlink
  # 与数据面包一同升级：校验根目录并生成独立安装所需的 systemd 覆盖单元。
  - src: ${STAGE}/syedge/syedge-instance
    dst: /usr/libexec/syedge/syedge-instance
    file_info: { mode: 0755, owner: root, group: root }
  - src: ${STAGE}/syedge/syedge.service
    dst: /usr/lib/systemd/system/syedge.service
  - src: ${STAGE}/syedge/syedge@.service
    dst: /usr/lib/systemd/system/syedge@.service
  - src: ${STAGE}/syedge/logrotate
    dst: /etc/logrotate.d/syedge
    type: config|noreplace
scripts:
  preinstall: ${STAGE}/scripts/syedge-preinstall.sh
  postinstall: ${STAGE}/scripts/syedge-postinstall.sh
  preremove: ${STAGE}/scripts/syedge-preremove.sh
rpm:
  scripts:
    posttrans: ${STAGE}/scripts/syedge-posttrans.sh
