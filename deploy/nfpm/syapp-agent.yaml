# syapp-agent 软件包：agent、提权 wrapper、sudoers 与 systemd 单元。安装后写入初始配置并启动 syapp。
name: syapp-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: EdgeTraffic OS <support@edgetraffic.invalid>
vendor: EdgeTraffic OS
homepage: https://github.com/xiaoguan521/edgetraffic-os
license: Proprietary
description: |
  syapp-agent: EdgeTraffic OS edge agent. Connects outbound to the console only and never listens on any port.
depends:
  - syapp
  - sudo
recommends:
  - nftables   # 仅可选的 syapp-firewall 需要
contents:
  - src: ${STAGE}/agent/syapp-agent
    dst: /usr/bin/syapp-agent
    file_info: { mode: 0755 }
  - src: ${STAGE}/agent/syapp-wrapper
    dst: /usr/libexec/syapp/syapp-wrapper
    file_info: { mode: 0755, owner: root, group: root }
  - src: ${STAGE}/agent/sudoers
    dst: /etc/sudoers.d/syapp-agent
    type: config
    file_info: { mode: 0440, owner: root, group: root }
  - src: ${STAGE}/agent/syapp-agent.service
    dst: /usr/lib/systemd/system/syapp-agent.service
  - src: ${STAGE}/agent/syapp-agent@.service
    dst: /usr/lib/systemd/system/syapp-agent@.service
  # 同机多实例管理：add / remove / list / check / reopen-all（设计 0001 第 5.7 节）
  - src: ${STAGE}/agent/syapp-instance
    dst: /usr/sbin/syapp-instance
    file_info: { mode: 0755, owner: root, group: root }
  # 可选的节点防火墙：默认不启用，由管理员执行 syapp-firewall enable --ssh-from ...
  - src: ${STAGE}/agent/syapp-firewall
    dst: /usr/sbin/syapp-firewall
    file_info: { mode: 0755, owner: root, group: root }
  - src: ${STAGE}/agent/syapp-firewall.service
    dst: /usr/lib/systemd/system/syapp-firewall.service
scripts:
  preinstall: ${STAGE}/scripts/agent-preinstall.sh
  postinstall: ${STAGE}/scripts/agent-postinstall.sh
  preremove: ${STAGE}/scripts/agent-preremove.sh
