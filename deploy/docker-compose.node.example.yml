# 边缘节点（Docker）示例：syedge + syedge-agent，由控制台托管配置。
# 镜像：ghcr.io/xiaoguan521/edgetraffic-os/node:<版本>（发布流水线同步产出，amd64 / arm64）。
#
# 镜像内安装根目录 = 发布时的编译前缀（发布镜像为 /home/atwasoft/syedge；自行构建用 SYEDGE_PREFIX 构建参数）。
# 下面用 ${P} 表示它；卷必须挂在该目录下的子目录，不能覆盖整个安装根目录（里面有二进制）。
# 数据面编译为相对前缀的路径，所以配置、日志、pid、临时目录都在 ${P} 下，容器里手工运维只需 -p ${P}。
#
# 首次使用：docker compose -f docker-compose.node.example.yml up -d
# 然后在控制台“节点”页“添加节点”，把生成的注册命令在容器里执行：
#   docker compose -f docker-compose.node.example.yml exec node syedge-agent enroll ...
# 注册令牌只能用一次；注册后 agent 自动启动，配置、证书、Lua 都由控制台发布，不要手工放进容器。
name: syedge-node

services:
  node:
    image: ghcr.io/xiaoguan521/edgetraffic-os/node:${ETOS_TAG:-latest}
    hostname: edge-01                 # 节点名；同一台宿主机多个容器要不同
    restart: unless-stopped
    stop_grace_period: 30s            # 退出时 quit 优雅排空连接
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    ports:
      - "80:80"
      - "443:443"
      # 如控制台里还配置了其它监听端口，在这里同样映射
    volumes:
      # 1) 配置版本库（含控制台下发的证书、Lua 脚本、站点配置）：必须持久化，
      #    否则重建容器后退回初始版本，需要等控制台重新下发。
      - conf:/home/atwasoft/syedge/conf
      # 2) agent 状态（节点身份 node.json、证书、备份）：丢失后必须重新注册。
      - agent:/home/atwasoft/syedge/agent
      # 3) 日志：error.log / access.json。想在宿主机直接看或交给日志采集，改成绑定挂载，
      #    例如 ./logs:/home/atwasoft/syedge/logs（宿主机目录会被容器内 chown 给运行用户）。
      - logs:/home/atwasoft/syedge/logs
      # 缓存 cache/ 与 pid run/ 不需要持久化。
      # 机器 ID：避免重建容器后被当成新主机（可选，需先在宿主机创建该文件）
      # - ./machine-id:/etc/machine-id

    # 控制台地址与令牌在注册命令里给出，这里不需要环境变量。
    # 控制台和节点在同一个 compose 网络时，注册命令里的地址用服务名；跨主机用控制台对外地址。

volumes:
  conf: {}
  agent: {}
  logs: {}

# ---------------------------------------------------------------------------
# 常见问题
# - 证书：由控制台“证书”页上传/申请，随配置版本发布到 conf/releases/<版本>/ssl/，
#   不要用卷单独映射证书目录。
# - Lua：托管渲染的 Lua 由控制台发布；需要 lua 授权，且节点要装 Lua 附加包
#   （模块在 ${P}/modules/，基础节点镜像不含）。附加包需要时基于节点镜像再构建一层。
# - 自定义 Lua 库放 ${P}/lualib/ 只适用于独立模式，托管节点不使用。
# - 校验/重载（排障）：
#     docker compose exec node /home/atwasoft/syedge/sbin/syedge -p /home/atwasoft/syedge -t
#     docker compose exec node /home/atwasoft/syedge/sbin/syedge -p /home/atwasoft/syedge -s reload
#   不要 docker restart 来“重载配置”；容器停止才会停止数据面，滚动更换请先摘流量。
# - 升级镜像：保留三个卷，替换镜像并重建容器即可（conf 与 agent 状态保留）。
#   旧版（≤0.4.8）布局的卷不兼容新布局，需新建卷重新注册。
