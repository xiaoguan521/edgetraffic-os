syntax = "proto3";

// 控制台 <-> agent 协议（规格书 5.3）。
// agent 主动发起连接；除 Enroll 外全部要求 mTLS。
// 每条 ServerMessage 另带 Ed25519 应用层签名与 cmd_id，用于防伪造和防重放。
package edgetraffic.agent.v1;

option go_package = "github.com/xiaoguan521/edgetraffic-os/api/gen/agent/v1;agentv1";

service AgentGateway {
  // 仅凭一次性注册令牌，不要求客户端证书。
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // mTLS 双向流：agent 上报，控制台下发指令。
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  // 配置包分片下载。
  rpc FetchBundle(FetchBundleRequest) returns (stream BundleChunk);
  // 升级包分片下载（规格书 12.6）：只能下载控制台版本库中已验签的包；签名随 UpgradeDataplane / UpgradeAgent 下发，
  // 由 wrapper（数据面）或 agent（自身）在使用前校验。
  rpc FetchPackage(FetchPackageRequest) returns (stream BundleChunk);
}

message EnrollRequest {
  string enroll_token = 1;
  bytes csr_der = 2;            // agent 本地生成 Ed25519 密钥后的 CSR
  string hostname = 3;
  string machine_fingerprint = 4;
  string agent_version = 5;
}

message EnrollResponse {
  string node_id = 1;
  bytes client_cert_der = 2;    // SAN = spiffe://edgetraffic/node/<node_id>，30 天
  bytes ca_cert_der = 3;
  bytes command_pubkey = 4;     // 控制台指令签名公钥
}

message AgentMessage {
  string msg_id = 1;
  oneof body {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    CommandResult result = 12;
    LogChunk log = 13;
    DriftReport drift = 14;
  }
}

message Hello {
  string agent_version = 1;
  string syapp_version_output = 2; // syapp -V 原始输出
  string syapp_sha256 = 3;
  string applied_revision_id = 4;
  string machine_fingerprint = 5;
  string lua_addon = 6;              // 已安装的 syapp-lua 附加包：<syapp 版本>/<基础变体>（未安装为空，P10）
}

message Heartbeat {
  int64 ts_unix = 1;
  double cpu_percent = 2;
  uint64 mem_used_bytes = 3;
  uint64 active_connections = 4;
  uint64 requests_total = 5;
  string tree_hash = 6;             // current 目录哈希，用于漂移检测
  repeated SiteMinute site_minutes = 7;
  string lua_addon = 8;             // 同 Hello.lua_addon：手工安装 / 卸载附加包后无需重连即可上报
}

message SiteMinute {
  string site = 1;
  int64 minute_unix = 2;
  uint64 requests = 3;
  uint64 status_2xx = 4;
  uint64 status_3xx = 5;
  uint64 status_4xx = 6;
  uint64 status_5xx = 7;
  double p50_ms = 8;
  double p95_ms = 9;
  uint64 bytes_sent = 10;
}

message CommandResult {
  string cmd_id = 1;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    APPLIED = 1;
    INVALID = 2;        // syapp -t 失败
    CONFLICT = 3;       // parent_revision_id 不符
    ROLLED_BACK = 4;
    DEGRADED = 5;       // 回滚也失败
    REJECTED = 6;       // 验签失败 / 授权不允许
  }
  Status status = 2;
  string message = 3;
  string stderr = 4;
}

message LogChunk {
  string tail_id = 1;
  string file = 2;      // 仅限 access.json / error.log
  repeated string lines = 3;
}

message ServerMessage {
  string cmd_id = 1;
  int64 issued_at_unix = 2;   // ±30s 内有效
  bytes signature = 3;        // 对 body 的 Ed25519 签名
  oneof body {
    ApplyRevision apply = 10;
    Rollback rollback = 11;
    Probe probe = 12;
    TailLog tail = 13;
    Signal signal = 14;
    LicenseUpdate license = 15;
    UpgradeDataplane upgrade = 16;
    UpgradeAgent upgrade_agent = 17;
  }
}

message ApplyRevision {
  string revision_id = 1;          // ^r[0-9]{6,12}$
  string parent_revision_id = 2;   // 乐观锁
  string bundle_sha256 = 3;
  repeated PostCheck post_checks = 4;
  int32 timeout_seconds = 5;
}

message PostCheck {
  string host = 1;                 // 请求 127.0.0.1 时携带的 Host 头
  string path = 2;
  bool https = 3;
  repeated int32 expect_status = 4;
}

message Rollback { string to_revision_id = 1; }
message Probe { string revision_id = 1; }
message TailLog {
  string tail_id = 1;
  enum File { FILE_UNSPECIFIED = 0; ACCESS = 1; ERROR = 2; }
  File file = 2;
  int32 seconds = 3;
}
message Signal {
  enum Kind { KIND_UNSPECIFIED = 0; REOPEN = 1; QUIT = 2; }  // 没有 restart
  Kind kind = 1;
}
message LicenseUpdate { string raw = 1; }

// 漂移 diff 上报（规格书 12.7 路径 B，CLAUDE.md“agent 与安全”）：agent 发现当前版本目录被手工改动时主动上报。
// 只限受管版本目录 /opt/syapp/conf/releases/<当前版本>/ 内的文件；单文件超过上限或私钥文件（*.key）只报哈希。
// 协议中没有任何“读取文件”的请求：控制台不能让 agent 读取指定路径。
message DriftReport {
  string revision_id = 1;
  string tree_hash = 2;
  repeated DriftFile files = 3;
}

message DriftFile {
  enum Change { CHANGE_UNSPECIFIED = 0; MODIFIED = 1; ADDED = 2; REMOVED = 3; }
  string path = 1;            // 相对版本目录，不含 ..
  Change change = 2;
  string sha256 = 3;          // 现在的内容哈希（REMOVED 时为空）
  int64 size = 4;
  bytes content = 5;          // 现在的内容；私钥或超过上限时为空
  bool content_omitted = 6;
}

// 数据面二进制热升级（规格书 12.6）。START：agent 下载升级包与签名到投放目录，经 wrapper upgrade-start 验签、
// 切换并发 USR2 / WINCH，然后按 post_checks 探活，结果在 CommandResult 中返回；COMMIT / ABORT 对应 wrapper 子命令。
message UpgradeDataplane {
  enum Action { ACTION_UNSPECIFIED = 0; START = 1; COMMIT = 2; ABORT = 3; }
  Action action = 1;
  string version = 2;                 // ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$
  string package_sha256 = 3;
  bytes signature_json = 4;           // 厂商升级包签名文件（pkgsig），wrapper 以 root 校验
  repeated PostCheck post_checks = 5;
  int32 timeout_seconds = 6;
  bytes lua_signature_json = 7;       // 节点装有 syapp-lua 时，目标版本附加包的厂商签名（P10）；wrapper 与 syapp 包一起校验、一起切换
}

// agent 自升级：同一种厂商签名包，agent 校验后替换自身并只重启 agent 进程（不影响 syapp）。
message UpgradeAgent {
  string version = 1;
  string package_sha256 = 2;
  bytes signature_json = 3;
}

message FetchPackageRequest {
  string name = 1;      // syapp | syapp-agent | syapp-lua
  string version = 2;
  string arch = 3;      // amd64 | arm64
  string variant = 4;   // standard | gmssl | lua
}

message FetchBundleRequest { string revision_id = 1; }
message BundleChunk { bytes data = 1; int64 offset = 2; bool last = 3; }
