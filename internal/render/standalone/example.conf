# 独立模式示例站点（未接入控制台时使用）。
#
# 用法：复制到 conf.d/ 并改成自己的域名与后端，然后校验并重载（不会中断现有连接）：
#   cp @PREFIX@/share/defaults/standalone-example.conf @PREFIX@/conf/current/conf.d/example.conf
#   sudo @PREFIX@/sbin/@ID@ -p @PREFIX@ -c @PREFIX@/conf/current/@ID@.conf -e stderr -t
#   sudo systemctl reload @ID@
#
# 说明：
#   - @ID@.conf 已包含基线安全设置、JSON 访问日志、限速区域与常用 proxy_set_header；
#     未匹配任何 server_name 的请求会被直接断开。
#   - 在 location 中写 proxy_set_header 会覆盖 http 级别的全部设置，需要连同 Host、X-Real-IP、
#     X-Forwarded-For、X-Forwarded-Proto、X-Request-ID 五条一起重写；响应头请写在 server 级别。
#   - 接入控制台时，本机的自定义配置需要先导入为控制台版本（或确认替换），见 share/doc/STANDALONE.txt。

upstream example_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen       80;
    server_name  www.example.com;

    limit_req   zone=edge_per_ip  burst=40  nodelay;
    limit_conn  edge_conn  100;

    # 静态文件
    location / {
        root   html;
        index  index.html;
        try_files  $uri $uri/ =404;
    }

    # 反向代理到后端
    # 后端 keepalive 需要清空 Connection 头；location 内一旦写 proxy_set_header，基线的五条也要重写
    location /api/ {
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Request-ID       $request_id;
        proxy_set_header  Connection         "";
        proxy_pass        http://example_backend;
    }
}

