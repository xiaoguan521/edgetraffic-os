# site: example  revision: r000001  （渲染器生成示例）
upstream up_example_api {
    least_conn;
    server 10.0.1.11:8080  max_fails=3  fail_timeout=10s;
    server 10.0.1.12:8080  max_fails=3  fail_timeout=10s;
    keepalive 32;
}

server {
    listen       80;
    server_name  www.example.com;
    location / {
        return  301  https://$host$request_uri;
    }
}

server {
    listen       443  ssl;
    http2        on;
    server_name  www.example.com;

    ssl_certificate      certs/site-example.crt;
    ssl_certificate_key  certs/site-example.key;
    add_header  Strict-Transport-Security  "max-age=31536000"  always;

    include  snippets/security.conf;

    location / {
        root       /srv/syedge/sites/example/current;
        index      index.html;
        try_files  $uri $uri/ =404;
    }

    location /api/ {
        limit_except GET HEAD POST PUT DELETE {
            deny  all;
        }
        # location 内出现 proxy_set_header 时须重发基线的全部头
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_set_header  X-Request-ID       $request_id;
        proxy_set_header  Connection         "";
        proxy_pass        http://up_example_api;
    }
}
