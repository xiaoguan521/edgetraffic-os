# 链路上报 (skywalking) 与指标 (prometheus) 的初始化，http 级别，由主配置的 include conf.d/*.conf 载入。
# 示例值（已脱敏）：serviceName、serviceInstanceName、OAP 地址按实际修改；多节点时实例名要各不相同。

lua_shared_dict tracing_buffer     100m;
lua_shared_dict prometheus_metrics 10m;

init_worker_by_lua_block {
    -- SkyWalking
    local metadata_buffer = ngx.shared.tracing_buffer
    metadata_buffer:set('serviceName', 'example-service')
    metadata_buffer:set('serviceInstanceName', 'example-node-1')
    metadata_buffer:set('includeHostInEntrySpan', false)

    require("skywalking.util").set_randomseed()
    -- SkyWalking OAP 的 HTTP 上报地址
    require("skywalking.client"):startBackendTimer("http://192.0.2.10:22800")

    skywalking_tracer = require("skywalking.tracer")

    -- Prometheus
    prometheus = require("prometheus").init("prometheus_metrics")
    metric_bytes = prometheus:counter(
        "syedge_http_size_bytes", "Total size of HTTP", {"type", "route"})
    metric_requests = prometheus:counter(
        "syedge_http_requests_total", "Number of HTTP requests", {"status", "route"})
    metric_latency = prometheus:histogram(
        "syedge_http_latency", "HTTP request latency", {"route"})
    metric_connections = prometheus:gauge(
        "syedge_http_connections", "Number of HTTP connections", {"state"})
}

# 只对「没有自己 log_by_lua_block」的 location 生效（location 内的同阶段指令会覆盖这里）。
log_by_lua_block {
    metric_bytes:inc(tonumber(ngx.var.request_length), {"request", ngx.var.host})
    metric_bytes:inc(tonumber(ngx.var.bytes_sent), {"response", ngx.var.host})
    metric_requests:inc(1, {ngx.var.status, ngx.var.host})
    metric_latency:observe(tonumber(ngx.var.request_time), {ngx.var.host})
}
