# 链路上报 (skywalking) 与指标 (prometheus) 的初始化，http 级别，由主配置的 include conf.d/*.conf 载入。
#
# ===== 运维只改下面 init_worker_by_lua_block 开头的三个值 =====
#   OAP_ADDRESS    SkyWalking OAP 接收上报的 HTTP 地址
#   SERVICE_NAME   服务名
#   INSTANCE_NAME  实例名（多个节点同时上报时必须各不相同）
# 还保持示例值（192.0.2.10）时，worker 启动会在 error.log 里提示“请先修改 OAP_ADDRESS”，并且不上报。
# Lua 库不用再找：把同级目录 ../lualib/ 整个复制到 <安装根目录>/lualib/ 即可（见 LUA-PLACEMENT.md）。

lua_shared_dict tracing_buffer     100m;
lua_shared_dict prometheus_metrics 10m;

init_worker_by_lua_block {
    -- ===== 只改这三个值 =====
    local OAP_ADDRESS   = "http://192.0.2.10:22800"
    local SERVICE_NAME  = "example-service"
    local INSTANCE_NAME = "example-node-1"
    -- ========================

    -- SkyWalking
    local metadata_buffer = ngx.shared.tracing_buffer
    metadata_buffer:set('serviceName', SERVICE_NAME)
    metadata_buffer:set('serviceInstanceName', INSTANCE_NAME)
    metadata_buffer:set('includeHostInEntrySpan', false)

    require("skywalking.util").set_randomseed()
    if OAP_ADDRESS == "http://192.0.2.10:22800" then
        ngx.log(ngx.ERR, "skywalking: 请先修改 conf.d/10-skywalking.conf 里的 OAP_ADDRESS，当前仍是示例地址，链路不会上报")
    else
        require("skywalking.client"):startBackendTimer(OAP_ADDRESS)
    end

    skywalking_tracer = require("skywalking.tracer")

    -- Prometheus（指标名沿用 OpenResty 时代的 nginx_http_*，已有的 Grafana 面板不用改）
    prometheus = require("prometheus").init("prometheus_metrics")
    metric_bytes = prometheus:counter(
        "nginx_http_size_bytes", "Total size of HTTP", {"type", "route"})
    metric_requests = prometheus:counter(
        "nginx_http_requests_total", "Number of HTTP requests", {"status", "route"})
    metric_latency = prometheus:histogram(
        "nginx_http_latency", "HTTP request latency", {"route"})
    metric_connections = prometheus:gauge(
        "nginx_http_connections", "Number of HTTP connections", {"state"})
    metric_duration = prometheus:histogram(
        "nginx_http_request_duration_seconds", "HTTP request latency", {"host"})
}

# 只对「没有自己 log_by_lua_block」的 location 生效（location 内的同阶段指令会覆盖这里）。
log_by_lua_block {
    metric_bytes:inc(tonumber(ngx.var.request_length), {"request", ngx.var.host})
    metric_bytes:inc(tonumber(ngx.var.bytes_sent), {"response", ngx.var.host})
    metric_requests:inc(1, {ngx.var.status, ngx.var.host})
    metric_latency:observe(tonumber(ngx.var.request_time), {ngx.var.host})
    metric_duration:observe(tonumber(ngx.var.request_time), {ngx.var.host})
}
