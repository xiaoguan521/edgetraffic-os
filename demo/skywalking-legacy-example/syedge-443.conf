# 示例（已脱敏）：原生兼容配置接入 SkyWalking 的主配置结构。
# 域名与地址均为示例值（example.com、192.0.2.0/24），按实际替换。
load_module /opt/syedge/modules/lua/ndk_http_module.so;
load_module /opt/syedge/modules/lua/ngx_http_lua_module.so;
worker_processes 4;
events {
    use epoll;
    worker_connections 20480;
}
pid /opt/syedge/logs/syedge-443.pid;

http {
    include mime.types;
    # SkyWalking / Prometheus 的初始化在 conf.d/10-skywalking.conf
    include conf.d/*.conf;
    default_type application/octet-stream;

    # 第一项必须是 R/lualib（自有库目录），其后是附加包自带目录
    lua_package_path  "/opt/syedge/lualib/?.lua;/opt/syedge/lualib/?/init.lua;/opt/syedge/modules/lua-1.30.6-1/lualib/?.lua;/opt/syedge/modules/lua-1.30.6-1/lualib/?/init.lua;;";
    lua_package_cpath "/opt/syedge/modules/lua-1.30.6-1/lualib/?.so;;";

    # 指标端口：只放行采集端网段
    server {
        listen 9145;
        allow 192.0.2.0/24;
        deny  all;
        location /metrics {
            content_by_lua_block {
                metric_connections:set(ngx.var.connections_reading, {"reading"})
                metric_connections:set(ngx.var.connections_waiting, {"waiting"})
                metric_connections:set(ngx.var.connections_writing, {"writing"})
                prometheus:collect()
            }
        }
    }

    server {
        listen 443 ssl;
        server_name www.example.com;
        ssl_certificate     /opt/syedge/certs/example.com.pem;
        ssl_certificate_key /opt/syedge/certs/example.com.key;

        # 带链路的 location：rewrite / body_filter / log 三段必须齐全
        location /app-a/ {
            rewrite_by_lua_block {
                skywalking_tracer:start("upstream service")
            }
            proxy_pass http://192.0.2.11:8080;
            body_filter_by_lua_block {
                if ngx.arg[2] then
                    skywalking_tracer:finish()
                end
            }
            log_by_lua_block {
                skywalking_tracer:prepareForReport()
            }
        }
        location /app-b/ {
            rewrite_by_lua_block {
                skywalking_tracer:start("upstream service")
            }
            proxy_pass http://192.0.2.12:8080;
            body_filter_by_lua_block {
                if ngx.arg[2] then
                    skywalking_tracer:finish()
                end
            }
            log_by_lua_block {
                skywalking_tracer:prepareForReport()
            }
        }

        # 不带链路的 location：不要调用 skywalking_tracer，也不要写 server 级的 log_by_lua_block
        location /static/ {
            alias /opt/html/static/;
        }
    }
}
