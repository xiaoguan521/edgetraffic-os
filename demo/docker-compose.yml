# EdgeTraffic OS 演示环境：一台 Linux 服务器上运行
#   console   控制台（Web 8443，节点连接 9443）
#   node1/2   两台边缘节点（syapp + syapp-agent），HTTP 分别映射到宿主机 8001 / 8002
#   backend1/2 演示用上游业务服务
# 用法见 demo/README.md：./demo.sh up（本地构建）或 ./demo.sh pull（拉取发布镜像，免构建）
#   ETOS_REGISTRY / ETOS_TAG 决定镜像名，./demo.sh pull 会写入 demo/.env
name: edgetraffic-demo

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  console-data: {}

services:
  console:
    build: { context: .., dockerfile: demo/Dockerfile.console, args: { EXTRA_LICENSE_KEY: "${EXTRA_LICENSE_KEY:-}" } }
    image: ${ETOS_REGISTRY:-edgetraffic-os}/console:${ETOS_TAG:-demo}
    environment:
      ETOS_GRPC_HOSTS: "console,172.30.0.10"
      ETOS_GRPC_ADVERTISE: "console:9443"
      ETOS_DATA: /var/lib/syapp-console
      ETOS_ACME_CA_FILE: "${ETOS_ACME_CA_FILE:-}"
      ETOS_DB: "${ETOS_DB:-}"
    volumes:
      - console-data:/var/lib/syapp-console
      - ./keys:/keys:ro
    ports:
      - "${CONSOLE_PORT:-8443}:8443"
    networks:
      edge: { ipv4_address: 172.30.0.10 }
    restart: unless-stopped

  node1:
    build: { context: .., dockerfile: demo/Dockerfile.node, args: { EXTRA_LICENSE_KEY: "${EXTRA_LICENSE_KEY:-}" } }
    image: ${ETOS_REGISTRY:-edgetraffic-os}/node:${ETOS_TAG:-demo}
    hostname: edge-sg-01
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    ports:
      - "${NODE1_PORT:-8001}:80"
    networks:
      edge: { ipv4_address: 172.30.0.21 }
    restart: unless-stopped

  node2:
    build: { context: .., dockerfile: demo/Dockerfile.node, args: { EXTRA_LICENSE_KEY: "${EXTRA_LICENSE_KEY:-}" } }
    image: ${ETOS_REGISTRY:-edgetraffic-os}/node:${ETOS_TAG:-demo}
    hostname: edge-sg-02
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    ports:
      - "${NODE2_PORT:-8002}:80"
    networks:
      edge: { ipv4_address: 172.30.0.22 }
    restart: unless-stopped

  backend1:
    build: { context: .., dockerfile: demo/Dockerfile.backend }
    image: ${ETOS_REGISTRY:-edgetraffic-os}/demo-backend:${ETOS_TAG:-demo}
    environment: { INSTANCE: order-api-1 }
    networks:
      edge: { ipv4_address: 172.30.0.31 }
    restart: unless-stopped

  backend2:
    build: { context: .., dockerfile: demo/Dockerfile.backend }
    image: ${ETOS_REGISTRY:-edgetraffic-os}/demo-backend:${ETOS_TAG:-demo}
    environment: { INSTANCE: order-api-2 }
    networks:
      edge: { ipv4_address: 172.30.0.32 }
    restart: unless-stopped

  # 可选：ACME 测试 CA（Let's Encrypt 官方的 Pebble，仅用于演示与测试，不随产品分发）
  # 启用：COMPOSE_PROFILES=acme ETOS_ACME_CA_FILE=/var/lib/syapp-console/acme-ca.pem ./demo.sh up
  # challtestsrv 把所有域名解析到 node1，Pebble 通过 80 端口访问 node1 完成 HTTP-01 验证。
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    profiles: [acme]
    command: -config /config/pebble-config.json -dnsserver 172.30.0.41:8053
    environment: { PEBBLE_VA_NOSLEEP: "1", PEBBLE_WFE_NONCEREJECT: "0" }
    volumes:
      - ./acme/pebble-config.json:/config/pebble-config.json:ro
    networks:
      edge: { ipv4_address: 172.30.0.40 }

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    profiles: [acme]
    command: -defaultIPv6 "" -defaultIPv4 172.30.0.21
    networks:
      edge: { ipv4_address: 172.30.0.41 }

  # 可选：PostgreSQL（默认使用 SQLite）。启用：
  # COMPOSE_PROFILES=postgres ETOS_DB=postgres://etos:etos@postgres:5432/etos?sslmode=disable ./demo.sh up
  postgres:
    image: postgres:16
    profiles: [postgres]
    environment: { POSTGRES_USER: etos, POSTGRES_PASSWORD: etos, POSTGRES_DB: etos }
    networks:
      edge: { ipv4_address: 172.30.0.50 }
