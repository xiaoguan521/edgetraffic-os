# Standalone-only Lua phase acceptance fixture.
# Copy this file to /opt/syedge/conf/current/conf.d/ on an un-enrolled node.
# It deliberately exercises request, response-header, and response-body phases;
# the console does not render these directives.

upstream standalone_lua_backend {
    server 172.31.0.31:9001;
    keepalive 4;
}

server {
    listen 80;
    server_name standalone-lua.example.com;

    # Request phase: reject unless the caller supplies the test header, then
    # expose the phase result in a response header for an observable assertion.
    location = /request-phase {
        set $standalone_lua_request_phase "unset";
        access_by_lua_block {
            if ngx.req.get_headers()["X-Lua-Test"] ~= "allow" then
                ngx.status = 403
                ngx.say("request phase blocked")
                return ngx.exit(403)
            end
            ngx.var.standalone_lua_request_phase = "allow"
        }
        add_header X-Standalone-Lua-Request-Phase $standalone_lua_request_phase always;
        proxy_pass http://standalone_lua_backend/request-phase;
    }

    # Response phases: add a response header and rewrite the upstream body.
    location = /response-phase {
        proxy_set_header Connection "";
        proxy_pass http://standalone_lua_backend/;
        header_filter_by_lua_block {
            ngx.header["X-Standalone-Lua-Header-Filter"] = "passed"
            ngx.header["Content-Length"] = nil
        }
        body_filter_by_lua_block {
            local chunk = ngx.arg[1]
            if chunk then
                ngx.arg[1] = string.gsub(chunk, "order%-api", "lua-filtered-api")
            end
        }
    }
}
