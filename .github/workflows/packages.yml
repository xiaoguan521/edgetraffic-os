# 软件包校验（不发布）：静态构建 syapp → 生成 RPM / DEB → 在发行版容器中并行安装冒烟。
# 仅手动触发，可选择代表性子集（CentOS 7、Rocky 9、Ubuntu 24.04 与两个独立模式场景）或全量场景；
# 合并到 main 与正式发布由 release.yml 运行完整的 9 个发行版，并且总是重新构建 syapp（不使用缓存）。
name: packages

on:
  workflow_dispatch:
    inputs:
      smoke_set:
        description: "安装测试的场景集合：pr（代表性子集）或 full（9 个发行版 + 独立模式）"
        type: choice
        options: [pr, full]
        default: pr

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: 0.0.0-pr.${{ github.run_number }}
      OUT: ${{ github.workspace }}/dist/release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # syapp 的产物只取决于数据面源码、补丁、依赖清单与构建脚本（不含产品版本号与日期），按这些文件的哈希缓存；
      # 任何一项改动都会重新构建。release.yml 不使用这个缓存。
      - name: cache static syapp
        id: syapp-cache
        uses: actions/cache@v4
        with:
          path: dist/syapp
          key: syapp-static-${{ matrix.arch }}-${{ hashFiles('dataplane/**', 'scripts/release/build-syapp-static.sh') }}
      - name: static syapp (glibc 2.17)
        if: steps.syapp-cache.outputs.cache-hit != 'true'
        run: scripts/release/build-syapp-static.sh dist/syapp
      - name: static syapp from cache
        if: steps.syapp-cache.outputs.cache-hit == 'true'
        run: ls -l dist/syapp && tar -tzf dist/syapp/syapp-*.tar.gz opt/syapp/sbin/syapp
      - name: build web
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: rpm / deb
        run: |
          trap 'echo "::error title=package::exit $? at: $BASH_COMMAND"' ERR
          for i in 1 2 3; do GOFLAGS= go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0 && break; echo "retry $i"; sleep 10; done; command -v "$(go env GOPATH)/bin/nfpm"
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/release/package.sh pkg ${{ matrix.arch }} dist/syapp/syapp-*.tar.gz
      - name: install smoke (parallel; PR subset unless dispatched with full)
        env:
          SMOKE_SET: ${{ inputs.smoke_set || 'pr' }}
        run: scripts/release/smoke-packages.sh "$OUT" ${{ matrix.arch }}
