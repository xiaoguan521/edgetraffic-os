# 软件包校验（不发布）：静态构建 syedge → 生成 RPM / DEB → 在发行版容器中并行安装冒烟。
# 仅手动触发，可选择代表性子集（CentOS 7、Rocky 9、Ubuntu 24.04 与两个独立模式场景）或全量场景；
# 合并到 main 与正式发布由 release.yml 运行完整的 9 个发行版，并且总是重新构建 syedge（不使用缓存）。
name: packages

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "dataplane/**"
      - "scripts/release/**"
      - "scripts/ci/all-package.sh"
      - "cmd/syedge-wrapper/**"
      - "cmd/syedge-agent/**"
      - "cmd/syedge-instance/**"
      - "internal/wrapper/**"
      - "internal/instance/**"
      - "internal/layout/**"
      - "internal/render/profile.go"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "dataplane/**"
      - "scripts/release/**"
      - "scripts/ci/all-package.sh"
      - "cmd/syedge-wrapper/**"
      - "cmd/syedge-agent/**"
      - "cmd/syedge-instance/**"
      - "internal/wrapper/**"
      - "internal/instance/**"
      - "internal/layout/**"
      - "internal/render/profile.go"
      - ".github/workflows/packages.yml"
  workflow_dispatch:
    inputs:
      smoke_set:
        description: "安装测试的场景集合：pr（代表性子集）或 full（9 个发行版 + 独立模式）"
        type: choice
        options: [pr, full]
        default: pr
      prefix:
        description: "数据面及 console/node/agent/instance 组件的编译期默认安装前缀"
        type: string
        required: false
        default: "/home/atwasoft/syedge"

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: 0.0.0-pr.${{ github.run_number }}
      OUT: ${{ github.workspace }}/dist/release
      SYEDGE_PREFIX: ${{ inputs.prefix || '/home/atwasoft/syedge' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # syedge 的产物只取决于数据面源码、补丁、依赖清单与构建脚本（不含产品版本号与日期），按这些文件的哈希缓存；
      # 任何一项改动都会重新构建。release.yml 不使用这个缓存。
      - name: cache static syedge
        id: syedge-cache
        uses: actions/cache@v4
        with:
          path: dist/syedge
          key: syedge-static-${{ matrix.arch }}-${{ inputs.prefix || 'home-atwasoft-syedge' }}-${{ hashFiles('dataplane/**', 'scripts/release/build-syedge-static.sh', 'scripts/validate-prefix.sh') }}
      - name: static syedge (glibc 2.17)
        if: steps.syedge-cache.outputs.cache-hit != 'true'
        run: scripts/release/build-syedge-static.sh dist/syedge
      - name: static syedge from cache
        if: steps.syedge-cache.outputs.cache-hit == 'true'
        run: ls -l dist/syedge && tar -tzf dist/syedge/syedge-*.tar.gz "${SYEDGE_PREFIX#/}/sbin/syedge"
      - name: GM and Lua upgrade package layout
        run: |
          bash scripts/ci/addon-package.sh
          bash scripts/ci/all-package.sh
          bash scripts/ci/package-prefix.sh
      - name: build web
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: rpm / deb
        run: |
          trap 'echo "::error title=package::exit $? at: $BASH_COMMAND"' ERR
          for i in 1 2 3; do GOFLAGS= go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0 && break; echo "retry $i"; sleep 10; done; command -v "$(go env GOPATH)/bin/nfpm"
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/release/package.sh pkg ${{ matrix.arch }} dist/syedge/syedge-*.tar.gz
      - name: download v0.4.2 packages for upgrade regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ '${{ matrix.arch }}' == amd64 ]]; then rpm_arch=x86_64; else rpm_arch=aarch64; fi
          mkdir -p "$RUNNER_TEMP/syedge-v0.4.2"
          gh release download v0.4.2 -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/syedge-v0.4.2" \
            -p "syedge-0.4.2-1.$rpm_arch.rpm" -p "syedge-agent-0.4.2-1.$rpm_arch.rpm" \
            -p 'syedge_0.4.2_${{ matrix.arch }}.deb' -p 'syedge-agent_0.4.2_${{ matrix.arch }}.deb' -p SHA256SUMS
          (cd "$RUNNER_TEMP/syedge-v0.4.2" && sha256sum -c SHA256SUMS --ignore-missing)
      - name: install smoke (parallel; PR subset unless dispatched with full)
        env:
          SMOKE_SET: ${{ inputs.smoke_set || 'pr' }}
          SMOKE_PREVIOUS_DIR: ${{ runner.temp }}/syedge-v0.4.2
        run: scripts/release/smoke-packages.sh "$OUT" ${{ matrix.arch }}
      - name: node install, enroll and publish with custom prefix and systemd
        env:
          SMOKE_PREFIX: /home/atwasoft/node
          SMOKE_UMASK: '077'
          SMOKE_ROOT_MODE: '0751'
          SMOKE_HOME_SANDBOX: '1'
          SMOKE_ROOT_MASTER: ${{ matrix.arch == 'arm64' && '1' || '' }}
        run: |
          scripts/release/package.sh node ${{ matrix.arch }} dist/syedge/syedge-*.tar.gz
          go build -mod=vendor -o "$RUNNER_TEMP/lic" ./cmd/syedge-license-server
          "$RUNNER_TEMP/lic" keygen -kid etos-ci-ephemeral -out "$RUNNER_TEMP/keys" > "$RUNNER_TEMP/keygen.txt"
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' "$RUNNER_TEMP/keygen.txt" | tail -1 | tr -d '"')
          ld="-X github.com/xiaoguan521/edgetraffic-os/internal/license.ciKey=$pub -X github.com/xiaoguan521/edgetraffic-os/internal/layout.defaultSystemRoot=$SYEDGE_PREFIX"
          CGO_ENABLED=0 go build -mod=vendor -ldflags "$ld" -o "$RUNNER_TEMP/smoke-console" ./cmd/syedge-console
          mkdir -p "$RUNNER_TEMP/smoke-pkg"
          tar -C "$RUNNER_TEMP/smoke-pkg" -xzf "$OUT/syedge-node-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          CGO_ENABLED=0 go build -mod=vendor -ldflags "$ld" -o "$RUNNER_TEMP/smoke-pkg/syedge-node-$VERSION-linux-${{ matrix.arch }}/rootfs/usr/bin/syedge-agent" ./cmd/syedge-agent
          tar -C "$RUNNER_TEMP/smoke-pkg" -czf "$RUNNER_TEMP/smoke-node.tar.gz" .
          LIC_TOOL="$RUNNER_TEMP/lic" LIC_KEY="$RUNNER_TEMP/keys/etos-ci-ephemeral.key" LIC_KID=etos-ci-ephemeral \
            scripts/release/smoke-node.sh "$RUNNER_TEMP/smoke-node.tar.gz" "$RUNNER_TEMP/smoke-console"
      - name: node install using compiled default prefix
        if: matrix.arch == 'amd64'
        env:
          SMOKE_PREFIX: ${{ inputs.prefix || '/home/atwasoft/syedge' }}
        run: |
          LIC_TOOL="$RUNNER_TEMP/lic" LIC_KEY="$RUNNER_TEMP/keys/etos-ci-ephemeral.key" LIC_KID=etos-ci-ephemeral \
            scripts/release/smoke-node.sh "$RUNNER_TEMP/smoke-node.tar.gz" "$RUNNER_TEMP/smoke-console"
      - name: node image entrypoint smoke
        run: |
          context=$(mktemp -d)
          mkdir -p "$context/node"
          tar -C "$context" -xzf "$OUT/syedge-node-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          mv "$context/syedge-node-$VERSION-linux-${{ matrix.arch }}/rootfs" "$context/node/rootfs"
          cp demo/node/entrypoint.sh demo/node/systemctl "$context/node/"
          docker build -q --build-arg "SYEDGE_PREFIX=$SYEDGE_PREFIX" -f deploy/docker/node.Dockerfile -t syedge-node-prefix-smoke "$context"
          container=$(docker run -d syedge-node-prefix-smoke)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker logs "$container" 2>&1 | grep -q 'syedge started:'; then ready=1; break; fi
            [[ $(docker inspect -f '{{.State.Running}}' "$container") == true ]] || break
            sleep 1
          done
          docker logs "$container"
          [[ "$ready" == 1 ]] || { echo 'node image entrypoint failed' >&2; exit 1; }
          docker stop -t 15 "$container" >/dev/null
