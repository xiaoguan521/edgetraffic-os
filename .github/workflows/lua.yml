name: lua

# P10 验收：syedge-lua 附加包 × 标准版 / 国密版基础包 × amd64 / arm64。
# 仅通过 GitHub Actions 的 Run workflow 手动触发。
on:
  push:
    branches: [main]
    paths:
      - "dataplane/lua/**"
      - "dataplane/build-syedge-lua.sh"
      - "internal/render/lua*"
      - "internal/render/profile.go"
      - "internal/layout/**"
      - "internal/instance/**"
      - "cmd/syedge-instance/**"
      - "internal/wrapper/lua*"
      - "internal/agent/apply/**"
      - "internal/agent/conn/**"
      - "internal/console/deploy/**"
      - "internal/console/gateway/**"
      - "internal/pkg/configbundle/**"
      - "scripts/ci/lua-acceptance.sh"
      - "scripts/ci/lua-custom-prefix.sh"
      - "scripts/ci/lua-instance-targets.sh"
      - "scripts/release/package.sh"
      - ".github/workflows/lua.yml"
  pull_request:
    paths:
      - "dataplane/lua/**"
      - "dataplane/build-syedge-lua.sh"
      - "internal/render/lua*"
      - "internal/render/profile.go"
      - "internal/layout/**"
      - "internal/instance/**"
      - "cmd/syedge-instance/**"
      - "internal/wrapper/lua*"
      - "internal/agent/apply/**"
      - "internal/agent/conn/**"
      - "internal/console/deploy/**"
      - "internal/console/gateway/**"
      - "internal/pkg/configbundle/**"
      - "scripts/ci/lua-acceptance.sh"
      - "scripts/ci/lua-custom-prefix.sh"
      - "scripts/ci/lua-instance-targets.sh"
      - "scripts/release/package.sh"
      - ".github/workflows/lua.yml"
  workflow_dispatch:
    inputs:
      prefix:
        description: "数据面及 console/node/agent/instance 组件的编译期默认安装前缀"
        required: false
        type: string
        default: "/home/atwasoft/syedge"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      SYEDGE_PREFIX: ${{ inputs.prefix || '/home/atwasoft/syedge' }}
    steps:
      - uses: actions/checkout@v5
      # C 部分（基础包与模块）按数据面输入缓存；etos 规则库与安装脚本由验收任务从源码刷新进附加包
      - name: cache add-on build
        id: cache
        uses: actions/cache@v4
        with:
          path: dist-lua
          key: syedge-lua-${{ matrix.arch }}-${{ inputs.prefix || 'home-atwasoft-syedge' }}-${{ hashFiles('dataplane/**', '!dataplane/lua/lualib/**', '!dataplane/lua/install.sh', '!dataplane/lua/uninstall.sh', 'scripts/rename-scan.sh', 'scripts/validate-prefix.sh', 'docs/NOTICE') }}
      - name: build syedge-lua (standard + Tongsuo bases, static)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist-lua
          KEEP_TLS_CLI="$PWD/dist-lua/tongsuo" dataplane/build-syedge-lua.sh -o dist-lua
          ls -l dist-lua dist-lua/base

  accept:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        base: [standard, gmssl]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      SYEDGE_PREFIX: ${{ inputs.prefix || '/home/atwasoft/syedge' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: restore add-on build
        uses: actions/cache/restore@v4
        with:
          path: dist-lua
          key: syedge-lua-${{ matrix.arch }}-${{ inputs.prefix || 'home-atwasoft-syedge' }}-${{ hashFiles('dataplane/**', '!dataplane/lua/lualib/**', '!dataplane/lua/install.sh', '!dataplane/lua/uninstall.sh', 'scripts/rename-scan.sh', 'scripts/validate-prefix.sh', 'docs/NOTICE') }}
          fail-on-cache-miss: true
      - name: refresh etos library and install scripts from source
        run: |
          p=$(ls dist-lua/syedge-lua-*-${{ matrix.arch }}.tar.gz)
          d=$(mktemp -d); tar -C "$d" -xzf "$p"
          rm -rf "$d/addon/lualib/etos"; cp -r dataplane/lua/lualib/etos "$d/addon/lualib/"
          install -m 0755 dataplane/lua/install.sh dataplane/lua/uninstall.sh "$d/"
          tar -C "$d" --owner=0 --group=0 -czf "$p" install.sh uninstall.sh addon
      - name: tools (wrk, CI package key, wrapper, license server)
        run: |
          sudo apt-get install -y -qq wrk >/dev/null
          go build -mod=vendor -o /tmp/lic ./cmd/syedge-license-server
          /tmp/lic keygen -kid etos-ci-pkg-ephemeral -out /tmp/keys > /tmp/pkgkey.txt
          pkgpub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/pkgkey.txt | tail -1 | tr -d '"')
          CGO_ENABLED=0 go build -mod=vendor -o /tmp/syedge-wrapper -ldflags "-X github.com/xiaoguan521/edgetraffic-os/internal/pkgsig.ciKey=$pkgpub -X github.com/xiaoguan521/edgetraffic-os/internal/layout.defaultSystemRoot=$SYEDGE_PREFIX" ./cmd/syedge-wrapper
      - name: Lua custom system root and named instances (${{ matrix.base }})
        run: bash scripts/ci/lua-custom-prefix.sh dist-lua ${{ matrix.base }}
      - name: Lua shared and independent instance selection (${{ matrix.base }})
        run: bash scripts/ci/lua-instance-targets.sh dist-lua ${{ matrix.base }}
      - name: GM and Lua multi-instance upgrade and rollback
        if: matrix.base == 'standard'
        run: |
          source dataplane/UPSTREAM
          ver="$UPSTREAM_VERSION-1"
          work=$(mktemp -d); chmod 0755 "$work"
          std=$(ls dist-lua/base/syedge-*-${{ matrix.arch }}.tar.gz | grep -v gmssl | head -1)
          gm=$(ls dist-lua/base/syedge-*-gmssl-${{ matrix.arch }}.tar.gz | head -1)
          lua=$(ls dist-lua/syedge-lua-*-${{ matrix.arch }}.tar.gz | head -1)
          if [[ '${{ matrix.arch }}' == x86_64 ]]; then arch=amd64; else arch=arm64; fi
          tar -C "$work" -xzf "$std"
          OUT="$work" SYEDGE_UPGRADE_VERSION="$ver" scripts/release/package.sh syedge-upgrade "$arch" "$gm" gmssl
          OUT="$work" scripts/release/package.sh lua-upgrade "$lua" "$ver" '${{ matrix.arch }}'
          sudo env "PATH=$PATH" \
            SYEDGE_TEST_STANDARD_BIN="$work$SYEDGE_PREFIX/sbin/syedge" \
            SYEDGE_GM_UPGRADE_PACKAGE="$work/syedge-$ver-gmssl-$arch.tar.gz" \
            SYEDGE_TEST_LUA_PACKAGE="$GITHUB_WORKSPACE/$lua" \
            SYEDGE_TEST_LUA_UPGRADE_PACKAGE="$work/syedge-lua-$ver-${{ matrix.arch }}.tar.gz" \
            go test -mod=vendor -count=1 -v -run TestGMWithLuaMultiInstanceRollback ./internal/wrapper/
      - name: P10 acceptance (${{ matrix.base }} / ${{ matrix.arch }})
        env:
          PKG_KEY: /tmp/keys/etos-ci-pkg-ephemeral.key
          PKG_KID: etos-ci-pkg-ephemeral
          WRAPPER: /tmp/syedge-wrapper
          LIC: /tmp/lic
          # GitHub arm64 共享机器的吞吐抖动过大，QPS 门槛只在 x86_64 上拦截；arm64 只报告，性能验收在专用实机上做
          PERF_GATE: ${{ matrix.arch == 'x86_64' && '1' || '0' }}
        run: scripts/ci/lua-acceptance.sh dist-lua ${{ matrix.base }}
      - name: Native Lua publish and rollback (${{ matrix.base }} / ${{ matrix.arch }})
        run: |
          sudo env "PATH=$PATH" \
            SYEDGE_LEGACY_IT_BIN="$SYEDGE_PREFIX/sbin/syedge" \
            SYEDGE_LEGACY_IT_MODULES="$SYEDGE_PREFIX/modules/lua" \
            go test -mod=vendor -count=1 -v -run '^TestLegacyLuaLiveLifecycle$' ./internal/agent/apply/
