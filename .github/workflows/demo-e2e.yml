# 在真实 Docker 环境中构建演示镜像，启动控制台 + 2 个节点 + 2 个后端，按演示脚本做端到端验证。
name: demo-e2e

on:
  push:
    branches: [main, mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    name: demo (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: ephemeral license key (CI only)
        run: |
          go build -mod=vendor -o /tmp/lic ./cmd/syapp-license-server
          /tmp/lic keygen -kid etos-ci-ephemeral -out /tmp/keys | tee /tmp/keygen.txt
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')
          echo "EXTRA_LICENSE_KEY=$pub" >> "$GITHUB_ENV"
      - name: build and start demo (with the ACME test CA)
        working-directory: demo
        env:
          COMPOSE_PROFILES: ${{ matrix.db == 'postgres' && 'acme,postgres' || 'acme' }}
          ETOS_ACME_CA_FILE: /var/lib/syapp-console/acme-ca.pem
          ETOS_DB: ${{ matrix.db == 'postgres' && 'postgres://etos:etos@postgres:5432/etos?sslmode=disable' || '' }}
        run: ./demo.sh up
      - name: end-to-end
        working-directory: demo
        env:
          COMPOSE_PROFILES: ${{ matrix.db == 'postgres' && 'acme,postgres' || 'acme' }}
          LIC_TOOL: /tmp/lic
          LIC_KEY: /tmp/keys/etos-ci-ephemeral.key
          LIC_KID: etos-ci-ephemeral
        run: ./e2e.sh
      - name: UI acceptance (Playwright：角色矩阵、未授权置灰、发布进度实时刷新)
        # 规格书 12.1 P5；playwright（Apache-2.0）只在测试中安装，不进入产品构建
        if: matrix.db == 'sqlite'
        env:
          BASE: http://127.0.0.1:8443
          LIC_TOOL: /tmp/lic
          LIC_KEY: /tmp/keys/etos-ci-ephemeral.key
          LIC_KID: etos-ci-ephemeral
          NO_PROXY: "*"
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/pw playwright@1.63.0 >/dev/null
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          NODE_PATH=/tmp/pw/node_modules node web/e2e/ui-acceptance.cjs
      - name: logs on failure
        if: failure()
        working-directory: demo
        run: |
          for s in console node1 node2; do
            docker compose logs --tail 40 $s | sed "s/^/::warning title=$s::/" | head -40
          done
