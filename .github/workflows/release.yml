# 多架构 / 多系统构建与发布。
#
#   推送 main / mvp：滚动预发布 dev-<分支>（二进制）+ 镜像 :<分支>、:sha-<提交>
#   推送标签 v*    ：正式 Release v<版本>（二进制 + SHA256SUMS）+ 镜像 :<版本>、:latest
#   手动触发       ：同推送分支
#
# 产物
#   控制台包  syedge-console-<ver>-{linux,darwin}-{amd64,arm64}.tar.gz、-windows-{amd64,arm64}.zip
#   节点包    syedge-node-<ver>-linux-{amd64,arm64}.tar.gz（syedge + agent + wrapper + install.sh）
#   软件包    syedge / syedge-agent / syedge-console 的 RPM 与 DEB（amd64 / arm64），在 9 个发行版上安装冒烟
#   镜像      ghcr.io/xiaoguan521/edgetraffic-os/{console,node,demo-backend}，linux/amd64 + linux/arm64
#
# syedge 是 C 程序，在 x86_64 与 arm64 runner 上原生编译（manylinux2014 容器，glibc 2.17，OpenSSL / PCRE2 / zlib 静态链接），不用 QEMU；
# Go 程序 CGO_ENABLED=0 交叉编译；构建任务先上传 Actions artifact，由 x86_64 发布任务统一上传到 Release 并生成 SHA256SUMS。
# 发布构建绝不注入 CI 临时授权公钥；冒烟测试用的控制台单独构建，不进入任何发布物。
name: release

on:
  push:
    branches: [main, mvp]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prefix:
        description: "数据面及 console/node/agent/instance 组件的编译期默认安装前缀"
        required: false
        type: string
        default: "/home/atwasoft/syedge"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io/xiaoguan521/edgetraffic-os
  GH_TOKEN: ${{ github.token }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      release: ${{ steps.v.outputs.release }}
      stable: ${{ steps.v.outputs.stable }}
      gotags: ${{ steps.v.outputs.gotags }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - id: v
        name: compute version
        run: |
          short=$(git rev-parse --short=7 HEAD)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "image_tag=$version" >> "$GITHUB_OUTPUT"
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            [[ "$version" == *-* ]] && echo "stable=false" >> "$GITHUB_OUTPUT" || echo "stable=true" >> "$GITHUB_OUTPUT"
            # 正式版本：不含演示签名密钥（规格书 8.8.1）
            echo "gotags=release" >> "$GITHUB_OUTPUT"
          else
            branch=${GITHUB_REF_NAME//\//-}
            if d=$(git describe --tags --match 'v[0-9]*' --abbrev=7 2>/dev/null); then version=${d#v}; else version=0.0.0-$branch.$short; fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "image_tag=$branch" >> "$GITHUB_OUTPUT"
            echo "release=dev-$branch" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "gotags=" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: release key gate (v* tags)
        if: github.ref_type == 'tag'
        run: |
          # 正式版本必须内置正式签名公钥、且不含演示密钥；否则在建草稿之前就失败
          go test -mod=vendor -tags release -count=1 -run 'TestReleaseKeyRing|TestProductionKeyTable' ./internal/license/
          go test -mod=vendor -tags release -count=1 -run 'TestReleasePackageKeys' ./internal/pkgsig/
      - name: prepare release
        env:
          RELEASE: ${{ steps.v.outputs.release }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # 正式版先建草稿，资产与校验和全部上传后再发布
            gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
                --notes-file docs/release-assets.md --title "SyEdge $VERSION"
          else
            # 滚动预发布：每次推送重建，始终指向分支最新提交
            gh release delete "$RELEASE" -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
            gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "开发版 $GITHUB_REF_NAME（$VERSION）" \
              --notes "分支 $GITHUB_REF_NAME 的自动构建，提交 $GITHUB_SHA。仅用于演示与测试，每次推送都会被覆盖。"
          fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            cross: "darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          - arch: arm64
            runner: ubuntu-22.04-arm
            cross: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.image_tag }}
      RELEASE: ${{ needs.meta.outputs.release }}
      GOTAGS: ${{ needs.meta.outputs.gotags }}
      OUT: ${{ github.workspace }}/dist/release
      SYEDGE_PREFIX: ${{ inputs.prefix || '/home/atwasoft/syedge' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: build deps
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: build syedge (static, glibc 2.17)
        run: scripts/release/build-syedge-static.sh dist/syedge
      # 国密变体（铜锁 NTLS）只在正式标签构建，作为升级包发布：厂商离线 sign-package -variant gmssl 签名后导入控制台版本库
      - name: build GM syedge (Tongsuo, static, glibc 2.17)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TLS_LIB=tongsuo scripts/release/build-syedge-static.sh dist/syedge-gm
      # syedge-lua 附加包（P10）：同一个包适配标准版与国密版，只在正式标签构建；离线 sign-package -name syedge-lua -variant lua 签名
      - name: build syedge-lua add-on (static, glibc 2.17)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          LUA=1 scripts/release/build-syedge-static.sh dist/syedge-lua
          mkdir -p "$OUT" && cp dist/syedge-lua/syedge-lua-*.tar.gz "$OUT"/
      # 发布构建总是重新编译 syedge（从不读取缓存）；main 上把这次的新产物写入缓存，
      # 供拉取请求的 packages 工作流复用（PR 只能读取自己分支与 main 的缓存）。
      - name: save static syedge for pull requests
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # 同一 key 已存在（例如重跑）时保存会失败，不影响发布
        uses: actions/cache/save@v4
        with:
          path: dist/syedge
          key: syedge-static-${{ matrix.arch }}-${{ inputs.prefix || 'home-atwasoft-syedge' }}-${{ hashFiles('dataplane/**', 'scripts/release/build-syedge-static.sh', 'scripts/validate-prefix.sh') }}
      - name: build web
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: package
        run: |
          trap 'echo "::error title=package::exit $? at: $BASH_COMMAND"' ERR
          export BUILD_DATE=$(date -u +%F) COMMIT=$(git rev-parse --short HEAD)
          scripts/release/package.sh node ${{ matrix.arch }} dist/syedge/syedge-*.tar.gz
          # 免 root 安装的节点包（user 模式，设计 0001 第 6 节）
          scripts/release/package.sh node-user ${{ matrix.arch }} dist/syedge/syedge-*.tar.gz
          # 统一升级用的升级包（未签名，厂商离线 sign-package 后导入控制台版本库）：标准版数据面（版本号即数据面版本）与 agent
          dp=$(basename dist/syedge/syedge-*.tar.gz); dp=${dp#syedge-}; dp=${dp%-*.tar.gz}
          SYEDGE_UPGRADE_VERSION=$dp scripts/release/package.sh syedge-upgrade ${{ matrix.arch }} dist/syedge/syedge-*.tar.gz
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # 变体需要不同发行序号，才能安全保存并回退原标准版。Lua 需使用相同升级版本。
            gm_ver="$dp-1"
            SYEDGE_UPGRADE_VERSION="$gm_ver" scripts/release/package.sh syedge-upgrade ${{ matrix.arch }} dist/syedge-gm/syedge-*-gmssl-*.tar.gz gmssl
            scripts/release/package.sh lua-upgrade dist/syedge-lua/syedge-lua-*.tar.gz "$gm_ver" "$(uname -m)"
            # 整合包：节点包 + 国密版 + Lua 附加包（首次安装与手动升级用；经控制台升级仍用上面的签名单包）
            scripts/release/package.sh all ${{ matrix.arch }} "$OUT/syedge-node-$VERSION-linux-${{ matrix.arch }}.tar.gz" \
              dist/syedge-gm/syedge-*-gmssl-*.tar.gz dist/syedge-lua/syedge-lua-*.tar.gz
            SYEDGE_GM_UPGRADE_PACKAGE="$OUT/syedge-$gm_ver-gmssl-${{ matrix.arch }}.tar.gz" \
              go test -mod=vendor -count=1 -run TestReleaseGMUpgradePackage ./internal/wrapper/
          fi
          scripts/release/package.sh agent-upgrade ${{ matrix.arch }}
          scripts/release/package.sh console linux ${{ matrix.arch }}
          for t in ${{ matrix.cross }}; do scripts/release/package.sh console ${t%/*} ${t#*/}; done
          scripts/release/package.sh backend ${{ matrix.arch }}
          scripts/release/package.sh vendor-tools linux ${{ matrix.arch }}
          scripts/release/package.sh license-portal ${{ matrix.arch }}
          if [[ ${{ matrix.arch }} == amd64 ]]; then
            for t in windows/amd64 darwin/arm64; do scripts/release/package.sh vendor-tools ${t%/*} ${t#*/}; done
          fi
          for i in 1 2 3; do GOFLAGS= go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0 && break; echo "retry $i"; sleep 10; done; command -v "$(go env GOPATH)/bin/nfpm"
          PATH="$(go env GOPATH)/bin:$PATH" scripts/release/package.sh pkg ${{ matrix.arch }} dist/syedge/syedge-*.tar.gz
          ls -l "$OUT"
      - name: download v0.4.2 packages for upgrade regression
        run: |
          if [[ '${{ matrix.arch }}' == amd64 ]]; then rpm_arch=x86_64; else rpm_arch=aarch64; fi
          mkdir -p "$RUNNER_TEMP/syedge-v0.4.2"
          gh release download v0.4.2 -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/syedge-v0.4.2" \
            -p "syedge-0.4.2-1.$rpm_arch.rpm" -p "syedge-agent-0.4.2-1.$rpm_arch.rpm" \
            -p 'syedge_0.4.2_${{ matrix.arch }}.deb' -p 'syedge-agent_0.4.2_${{ matrix.arch }}.deb' -p SHA256SUMS
          (cd "$RUNNER_TEMP/syedge-v0.4.2" && sha256sum -c SHA256SUMS --ignore-missing)
      - name: smoke test rpm / deb on 9 distributions + standalone (full, parallel)
        env:
          SMOKE_SET: full
          SMOKE_PREVIOUS_DIR: ${{ runner.temp }}/syedge-v0.4.2
        run: scripts/release/smoke-packages.sh "$OUT" ${{ matrix.arch }}

      - name: smoke test node package (systemd install + enroll + publish)
        env:
          SMOKE_PREFIX: ${{ inputs.prefix || '/home/atwasoft/syedge' }}
        run: |
          trap 'echo "::error title=smoke::exit $? at: $BASH_COMMAND"' ERR
          go build -mod=vendor -o /tmp/lic ./cmd/syedge-license-server
          /tmp/lic keygen -kid etos-ci-ephemeral -out /tmp/keys > /tmp/keygen.txt
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')
          # 仅本测试使用：控制台与 agent 注入临时公钥（agent 也会校验授权），不进入任何发布物。
          # 节点包其余内容（syedge、wrapper、systemd 单元、sudoers、install.sh）与发布包完全相同。
          ld="-X github.com/xiaoguan521/edgetraffic-os/internal/license.ciKey=$pub -X github.com/xiaoguan521/edgetraffic-os/internal/layout.defaultSystemRoot=$SYEDGE_PREFIX"
          CGO_ENABLED=0 go build -mod=vendor -ldflags "$ld" -o /tmp/smoke-console ./cmd/syedge-console
          mkdir -p /tmp/smoke-pkg && tar -C /tmp/smoke-pkg -xzf "$OUT"/syedge-node-$VERSION-linux-${{ matrix.arch }}.tar.gz   # 不能用 node-*：会同时匹配 node-user
          CGO_ENABLED=0 go build -mod=vendor -ldflags "$ld" -o /tmp/smoke-pkg/syedge-node-$VERSION-linux-${{ matrix.arch }}/rootfs/usr/bin/syedge-agent ./cmd/syedge-agent
          tar -C /tmp/smoke-pkg -czf /tmp/smoke-node.tar.gz .
          LIC_TOOL=/tmp/lic LIC_KEY=/tmp/keys/etos-ci-ephemeral.key LIC_KID=etos-ci-ephemeral \
            scripts/release/smoke-node.sh /tmp/smoke-node.tar.gz /tmp/smoke-console
      # 整合包只在正式标签构建（需要国密版与 Lua 附加包）。装一遍国密版 + Lua，再卸载，宿主机恢复干净。
      # 首次引入，暂不阻塞发布（continue-on-error）；确认在真实 runner 上稳定后改为必过。
      - name: smoke test all-in-one bundle (GM + Lua install, tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          trap 'echo "::warning title=all-bundle smoke::exit $? at: $BASH_COMMAND"' ERR
          d=$(mktemp -d); tar -C "$d" -xzf "$OUT"/syedge-all-$VERSION-linux-${{ matrix.arch }}.tar.gz
          cd "$d"/syedge-all-*
          sudo ./install.sh --gmssl
          sudo "$SYEDGE_PREFIX/sbin/syedge" -V 2>&1 | grep -q enable-ntls
          test -f "$SYEDGE_PREFIX/modules/lua/ngx_http_lua_module.so"
          systemctl is-active syedge.service
          sudo ./uninstall.sh --purge
      - name: release binaries have no CI key and run
        run: |
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')
          d=$(mktemp -d)
          tar -C "$d" -xzf "$OUT"/syedge-node-$VERSION-linux-${{ matrix.arch }}.tar.gz
          tar -C "$d" -xzf "$OUT"/syedge-console-$VERSION-linux-${{ matrix.arch }}.tar.gz
          for b in "$d"/*/rootfs/usr/bin/syedge-agent "$d"/*/syedge-console; do
            if strings "$b" | grep -qF "$pub"; then echo "::error::$(basename "$b") contains the CI license key"; exit 1; fi
          done
          "$d"/syedge-console-*/syedge-console -version | tee /dev/stderr | grep -q "$VERSION"
          "$d"/syedge-node-*/rootfs/usr/bin/syedge-agent version | grep -q "$VERSION"
          # 正式版本：控制台不含演示签名公钥，也不带演示用的 syedge-license-server
          if [[ "$GOTAGS" == *release* ]]; then
            if strings "$d"/syedge-console-*/syedge-console | grep -qF "2s66YtpjpEGRSzQU7Sus8hvAbDXp6yAQjOI3y1AeJlU="; then
              echo "::error::release console contains the demo signing key"; exit 1
            fi
            if ls "$d"/syedge-console-*/syedge-license-server >/dev/null 2>&1; then
              echo "::error::release console package ships syedge-license-server"; exit 1
            fi
          fi
          # 离线签名工具不含网络代码
          vt=$(mktemp -d); tar -C "$vt" -xzf "$OUT"/syedge-vendor-tools-$VERSION-linux-${{ matrix.arch }}.tar.gz
          "$vt"/*/syedge-license-signer version | grep -q "$VERSION"
          # 授权后台：能启动、内嵌 Web；正式版本不含演示签名公钥
          lp=$(mktemp -d); tar -C "$lp" -xzf "$OUT"/syedge-license-portal-$VERSION-linux-${{ matrix.arch }}.tar.gz
          "$lp"/*/syedge-license-server version | grep -q "$VERSION"
          if [[ "$GOTAGS" == *release* ]] && strings "$lp"/*/syedge-license-server | grep -qF "2s66YtpjpEGRSzQU7Sus8hvAbDXp6yAQjOI3y1AeJlU="; then
            echo "::error::release license portal contains the demo signing key"; exit 1
          fi
          "$lp"/*/syedge-license-server serve -listen 127.0.0.1:18600 -data "$lp/data" & lpid=$!
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18600/api/v1/setup/status >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:18600/api/v1/setup/status | grep -q '"initialized":false'
          curl -fsS http://127.0.0.1:18600/ | grep -q '<div id="app">'
          kill $lpid

      # 构建任务只把发布文件交给 publish 任务（工作流制品），不直接调用 Releases API：
      # GitHub 托管的 arm64 runner 访问 api.github.com 时多次出现 TLS 错误（“unrecognized name”），重试 5 分钟仍会失败
      - name: collect release assets
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          for f in "$OUT"/*.tar.gz "$OUT"/*.zip "$OUT"/*.deb "$OUT"/*.rpm; do
            [[ -f "$f" ]] && cp "$f" "$RUNNER_TEMP/assets/"
          done
          ls -l "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0   # 已是压缩包

      - name: build and push images (${{ matrix.arch }})
        run: |
          trap 'echo "::error title=images::exit $? at: $BASH_COMMAND"' ERR
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          S=$(mktemp -d)
          mkdir -p "$S/console" "$S/node" "$S/backend"
          tar -C "$S" -xzf "$OUT"/syedge-console-$VERSION-linux-${{ matrix.arch }}.tar.gz
          mv "$S"/syedge-console-*/syedge-* "$S/console/"   # 开发构建另含演示用的 syedge-license-server
          tar -C "$S" -xzf "$OUT"/syedge-node-$VERSION-linux-${{ matrix.arch }}.tar.gz
          mv "$S"/syedge-node-*/rootfs "$S/node/rootfs"
          cp demo/node/entrypoint.sh demo/node/systemctl "$S/node/"
          cp "$OUT"/backend-linux-${{ matrix.arch }}/demo-backend "$S/backend/"
          cp docs/NOTICE "$S/NOTICE"
          labels=(--label org.opencontainers.image.source=https://github.com/${{ github.repository }}
                  --label org.opencontainers.image.version=$VERSION
                  --label org.opencontainers.image.revision=$GITHUB_SHA
                  --label org.opencontainers.image.licenses=Proprietary)
          for img in console node backend; do
            name=$img; [[ $img == backend ]] && name=demo-backend
            ref="$REGISTRY/$name:$TAG-${{ matrix.arch }}"
            build_args=()
            [[ $img == node ]] && build_args+=(--build-arg "SYEDGE_PREFIX=$SYEDGE_PREFIX")
            docker build -q "${build_args[@]}" -f deploy/docker/$img.Dockerfile "${labels[@]}" -t "$ref" "$S"
            if [[ $img == node ]]; then
              docker run --rm --entrypoint syedge "$ref" -v
              node_container=$(docker run -d "$ref")
              trap 'docker rm -f "$node_container" >/dev/null 2>&1 || true' EXIT
              ready=0
              for i in $(seq 1 30); do
                if docker logs "$node_container" 2>&1 | grep -q 'syedge started:'; then ready=1; break; fi
                [[ $(docker inspect -f '{{.State.Running}}' "$node_container") == true ]] || break
                sleep 1
              done
              docker logs "$node_container"
              [[ "$ready" == 1 ]] || { echo 'node image failed to start through its entrypoint' >&2; exit 1; }
              docker stop -t 15 "$node_container" >/dev/null
              docker rm "$node_container" >/dev/null
              trap - EXIT
            fi
            docker push -q "$ref"
          done

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.image_tag }}
      RELEASE: ${{ needs.meta.outputs.release }}
    steps:
      - name: multi-arch image manifests
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          short=${GITHUB_SHA::7}
          for name in console node demo-backend; do
            tags=(-t "$REGISTRY/$name:$TAG" -t "$REGISTRY/$name:sha-$short")
            [[ "${{ needs.meta.outputs.stable }}" == true ]] && tags+=(-t "$REGISTRY/$name:latest")
            docker buildx imagetools create "${tags[@]}" "$REGISTRY/$name:$TAG-amd64" "$REGISTRY/$name:$TAG-arm64"
            docker buildx imagetools inspect "$REGISTRY/$name:$TAG" | grep -E 'Platform:' | sort -u
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - name: upload assets, checksums and publish release
        run: |
          cd "$RUNNER_TEMP/assets"
          ls -l
          sha256sum -- * | tee SHA256SUMS
          for f in *; do
            for try in 1 2 3 4 5; do
              if err=$(gh release upload "$RELEASE" -R "$GITHUB_REPOSITORY" --clobber "$f" 2>&1); then echo "uploaded $f"; break; fi
              echo "::warning title=upload $f try $try::${err//$'\n'/ }"
              [[ $try == 5 ]] && { echo "::error title=upload::$f: ${err//$'\n'/ }"; exit 1; }
              sleep $((try * 10))
            done
          done
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release edit "$RELEASE" -R "$GITHUB_REPOSITORY" --draft=false --latest=${{ needs.meta.outputs.stable }} \
              --prerelease=$([[ "${{ needs.meta.outputs.stable }}" == true ]] && echo false || echo true)
          fi
          {
            echo "### SyEdge $VERSION"
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE"
            echo
            echo '```'
            echo "docker pull $REGISTRY/console:$TAG"
            echo "docker pull $REGISTRY/node:$TAG"
            echo "docker pull $REGISTRY/demo-backend:$TAG"
            echo '```'
            echo '```'; cat SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
