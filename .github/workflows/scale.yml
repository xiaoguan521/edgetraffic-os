# 50 节点规模验收（规格书 12.1 集成与压测、12.6 统一升级）：真实控制台 + 50 个真实节点容器。
#   50 节点并行发布 < 60 秒；控制台宕机 30 分钟业务无影响；分 3 批热升级与回退各 < 10 分钟，压测中 0 失败、长连接不断。
# 约 1 小时，只在发布编排、agent、wrapper 或本测试变化时运行，也可手动触发（可调小宕机时长试跑）。
name: scale

on:
  push:
    branches: [main, "scale/**"]
    paths:
      - "internal/console/deploy/**"
      - "internal/console/gateway/**"
      - "internal/agent/**"
      - "internal/wrapper/**"
      - "demo/Dockerfile.*"
      - "demo/node/**"
      - "scripts/ci/scale-50.sh"
      - "cmd/etos-loadgen/**"
      - ".github/workflows/scale.yml"
  workflow_dispatch:
    inputs:
      down_minutes:
        description: 控制台宕机时长（分钟，验收为 30）
        default: "30"

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: tools and ephemeral CI keys (license + package signing)
        run: |
          sudo apt-get install -y -qq wrk >/dev/null
          go build -mod=vendor -o /tmp/lic ./cmd/syapp-license-server
          CGO_ENABLED=0 go build -mod=vendor -o /tmp/loadgen ./cmd/etos-loadgen
          /tmp/lic keygen -kid etos-ci-ephemeral -out /tmp/keys > /tmp/keygen.txt
          /tmp/lic keygen -kid etos-ci-pkg-ephemeral -out /tmp/keys > /tmp/pkgkey.txt
          echo "EXTRA_LICENSE_KEY=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')" >> "$GITHUB_ENV"
          echo "EXTRA_PKG_KEY=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/pkgkey.txt | tail -1 | tr -d '"')" >> "$GITHUB_ENV"
      - name: build images, start console and backends
        working-directory: demo
        run: |
          docker compose build console node1 backend1
          docker compose up -d --no-build console backend1 backend2
      - name: 50-node acceptance
        env:
          LIC_TOOL: /tmp/lic
          LIC_KEY: /tmp/keys/etos-ci-ephemeral.key
          LIC_KID: etos-ci-ephemeral
          PKG_KEY: /tmp/keys/etos-ci-pkg-ephemeral.key
          PKG_KID: etos-ci-pkg-ephemeral
          LOADGEN: /tmp/loadgen
          # 验收为 30 分钟；scale/** 分支用于调试脚本，只宕机 2 分钟
          DOWN_MIN: ${{ github.event.inputs.down_minutes || (startsWith(github.ref, 'refs/heads/scale/') && '2' || '30') }}
        run: scripts/ci/scale-50.sh
