name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: generated queries up to date (gorm/gen)
        run: make gen-check
      - name: vet and test
        run: make test
      - name: release-tag build (no demo signing key)
        run: |
          go vet -mod=vendor -tags release ./...
          go build -mod=vendor -tags release ./...
          # 除“必须内置正式公钥”的门禁外，release 构建下 license 包的其余测试都要通过
          go test -mod=vendor -tags release -count=1 -skip TestReleaseKeyRing ./internal/license/...
      - name: build
        run: make build
      - name: wrapper is static
        run: file bin/syapp-wrapper | grep -q "statically linked"

  postgres:
    # 控制台在 PostgreSQL 上的测试：单元测试每个用例一个独立 schema；再用真实控制台对 SQLite 与 PostgreSQL 各跑一遍 API 冒烟（含 -tls-auto）
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ETOS_TEST_DB: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: console tests on PostgreSQL
        run: go test -mod=vendor -count=1 ./internal/console/...
      - name: console smoke (SQLite and PostgreSQL, HTTPS via -tls-auto)
        run: |
          go build -mod=vendor -o /tmp/lic ./cmd/syapp-license-server
          /tmp/lic keygen -kid etos-ci-ephemeral -out /tmp/keys > /tmp/keygen.txt
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')
          CGO_ENABLED=0 go build -mod=vendor -o /tmp/console -ldflags "-X github.com/xiaoguan521/edgetraffic-os/internal/license.ciKey=$pub" ./cmd/syapp-console
          export LIC_KEY=/tmp/keys/etos-ci-ephemeral.key LIC_KID=etos-ci-ephemeral
          scripts/ci/console-smoke.sh /tmp/console /tmp/lic
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE smoke'
          scripts/ci/console-smoke.sh /tmp/console /tmp/lic "postgres://postgres:pg@127.0.0.1:5432/smoke?sslmode=disable"

  firewall:
    # 可选的节点防火墙：在两个网络命名空间之间真实收发包，验证放行 / 丢弃 / 防锁死 / 停用
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: firewall packet test
        run: |
          sudo apt-get install -y -qq nftables >/dev/null
          CGO_ENABLED=0 go build -mod=vendor -o /tmp/syapp-agent ./cmd/syapp-agent
          sudo scripts/ci/firewall-netns.sh /tmp/syapp-agent

  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/brand-check.sh

  dataplane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: build deps
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libssl-dev zlib1g-dev
      - name: hpack-gen test
        run: go test ./dataplane/hpack-gen/
      - name: build syapp (static dependencies, as released)
        run: dataplane/build-syapp.sh -S -o dist
      - name: install and run golden acceptance
        run: |
          trap 'echo "::error title=dataplane step::exit $? at: $BASH_COMMAND"' ERR
          sudo tar -C / -xzf dist/syapp-*.tar.gz
          sudo useradd -r -s /usr/sbin/nologin syapp || true
          R=/opt/syapp/conf/releases/r000001
          sudo mkdir -p $R/certs /run/syapp /var/log/syapp /var/cache/syapp /srv/syapp/sites/example/current
          sudo cp -r internal/render/testdata/golden/r000001/. $R/
          sudo cp /opt/syapp/share/defaults/mime.types $R/
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=www.example.com \
            -keyout $R/certs/site-example.key -out $R/certs/site-example.crt
          echo ok | sudo tee /srv/syapp/sites/example/current/index.html
          sudo ln -sfn releases/r000001 /opt/syapp/conf/current
          sudo cp dataplane/packaging/systemd/syapp.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl start syapp || { sudo journalctl -u syapp --no-pager | tail -20 | sed 's/^/::error::/'; exit 1; }
          sudo GITHUB_ACTIONS=true scripts/golden-rename.sh /opt/syapp/sbin/syapp www.example.com
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # 账号存储配额满时不阻塞流水线
        with:
          name: syapp-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 3

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check lockfile
        id: lock
        run: if [ -f web/pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "web/pnpm-lock.yaml not committed yet, skipping"; fi
      - if: steps.lock.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - if: steps.lock.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: steps.lock.outputs.present == 'true'
        run: cd web && pnpm install --frozen-lockfile && pnpm build
