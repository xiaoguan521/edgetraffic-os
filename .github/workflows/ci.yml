name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: secure legacy install parent on disposable runner
        run: sudo chmod go-w /opt
      - name: generated queries up to date (gorm/gen)
        run: make gen-check
      - name: gofmt and golangci-lint
        run: |
          unfmt="$(gofmt -l cmd internal dataplane)"
          if [ -n "$unfmt" ]; then echo "gofmt needed:"; echo "$unfmt"; exit 1; fi
          GOFLAGS= go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: vet and test
        run: make test
      - name: compiled prefix compatibility
        run: |
          for prefix in /home/atwasoft/syedge /srv/syedge; do
            ld="-X github.com/xiaoguan521/edgetraffic-os/internal/layout.defaultSystemRoot=$prefix"
            go test -mod=vendor -ldflags "$ld" ./internal/render -run '^TestHistoricalProfileDoesNotFollowCompiledDefault$'
            go test -mod=vendor -ldflags "$ld" ./internal/instance -run '^TestCompiledNonLegacyRootUsesItsOwnDirectories$'
            go test -mod=vendor -ldflags "$ld" ./internal/console/api -run '^TestNewGroupProfileUsesCompiledRoot$'
          done
      - name: release-tag build (no demo signing key)
        run: |
          go vet -mod=vendor -tags release ./...
          go build -mod=vendor -tags release ./...
          # 正式公钥已内置（2026-11-06 密钥仪式）：release 构建下发布门禁与其余测试都要通过
          go test -mod=vendor -tags release -count=1 ./internal/license/... ./internal/pkgsig/...
      - name: build
        run: make build
      - name: wrapper is static
        run: file bin/syedge-wrapper | grep -q "statically linked"

  postgres:
    # 控制台在 PostgreSQL 上的测试：单元测试每个用例一个独立 schema；再用真实控制台对 SQLite 与 PostgreSQL 各跑一遍 API 冒烟（含 -tls-auto）
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ETOS_TEST_DB: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: console tests on PostgreSQL
        run: go test -mod=vendor -count=1 ./internal/console/...
      - name: console smoke (SQLite and PostgreSQL, HTTPS via -tls-auto)
        run: |
          go build -mod=vendor -o /tmp/lic ./cmd/syedge-license-server
          /tmp/lic keygen -kid etos-ci-ephemeral -out /tmp/keys > /tmp/keygen.txt
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')
          /tmp/lic keygen -kid etos-ci-pkg-ephemeral -out /tmp/keys > /tmp/pkgkey.txt
          pkgpub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/pkgkey.txt | tail -1 | tr -d '"')
          CGO_ENABLED=0 go build -mod=vendor -o /tmp/console -ldflags "-X github.com/xiaoguan521/edgetraffic-os/internal/license.ciKey=$pub -X github.com/xiaoguan521/edgetraffic-os/internal/pkgsig.ciKey=$pkgpub" ./cmd/syedge-console
          export LIC_KEY=/tmp/keys/etos-ci-ephemeral.key LIC_KID=etos-ci-ephemeral PKG_KEY=/tmp/keys/etos-ci-pkg-ephemeral.key
          scripts/ci/console-smoke.sh /tmp/console /tmp/lic
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE smoke'
          scripts/ci/console-smoke.sh /tmp/console /tmp/lic "postgres://postgres:pg@127.0.0.1:5432/smoke?sslmode=disable"
      - name: upgrade from v0.1.0 without data loss (SQLite and PostgreSQL)
        # 规格书 12.3 P6：用真实的 v0.1.0 控制台建库写数据，再用当前控制台打开同一个库逐项核对
        run: |
          # v0.1.0 发布的提交（标签只在发布机上，按提交哈希获取）
          V010=a45301108fa7b5ea9702d000197fb83f60036cf4
          git fetch -q --depth 1 origin "$V010"
          git worktree add -q --detach /tmp/v010 "$V010"
          pub=$(grep -oE '"[A-Za-z0-9+/=]{44}"' /tmp/keygen.txt | tail -1 | tr -d '"')
          (cd /tmp/v010 && CGO_ENABLED=0 go build -mod=vendor -o /tmp/old-console -ldflags "-X github.com/xiaoguan521/edgetraffic-os/internal/license.ciKey=$pub" ./cmd/syapp-console \
            && go build -mod=vendor -o /tmp/old-lic ./cmd/syapp-license-server)   # v0.1.0 时产品还叫 syapp
          export LIC_KEY=/tmp/keys/etos-ci-ephemeral.key LIC_KID=etos-ci-ephemeral OLD_LIC=/tmp/old-lic
          scripts/ci/upgrade-from-v010.sh /tmp/old-console /tmp/console /tmp/lic
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE upgrade'
          scripts/ci/upgrade-from-v010.sh /tmp/old-console /tmp/console /tmp/lic "postgres://postgres:pg@127.0.0.1:5432/upgrade?sslmode=disable"
      - name: HA failover time (host network loss, crash, stop; < 30 s)
        run: sudo -E env PATH="$PATH" LIC_KEY=/tmp/keys/etos-ci-ephemeral.key LIC_KID=etos-ci-ephemeral scripts/ci/ha-failover.sh /tmp/console /tmp/lic 127.0.0.1:5432 postgres:pg

  firewall:
    # 可选的节点防火墙：在两个网络命名空间之间真实收发包，验证放行 / 丢弃 / 防锁死 / 停用
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: firewall packet test
        run: |
          sudo chmod go-w /opt
          sudo apt-get install -y -qq nftables >/dev/null
          CGO_ENABLED=0 go build -mod=vendor -o /tmp/syedge-agent ./cmd/syedge-agent
          sudo scripts/ci/firewall-netns.sh /tmp/syedge-agent

  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/brand-check.sh

  dataplane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: build deps
        run: |
          missing=()
          for pkg in libpcre2-dev libssl-dev zlib1g-dev; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          else
            echo 'Required build dependencies are already installed'
          fi
      - name: hpack-gen test
        run: go test ./dataplane/hpack-gen/
      - name: build syedge (static dependencies, as released)
        run: dataplane/build-syedge.sh -S -o dist
      - name: install and run golden acceptance
        run: |
          trap 'echo "::error title=dataplane step::exit $? at: $BASH_COMMAND"' ERR
          sudo chmod go-w /opt
          sudo tar -C / -xzf dist/syedge-*.tar.gz
          sudo useradd -r -s /usr/sbin/nologin syedge || true
          R=/opt/syedge/conf/releases/r000001
          sudo mkdir -p $R/certs /run/syedge /var/log/syedge /var/cache/syedge /srv/syedge/sites/example/current
          sudo cp -r internal/render/testdata/golden/r000001/. $R/
          sudo cp /opt/syedge/share/defaults/mime.types $R/
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=www.example.com \
            -keyout $R/certs/site-example.key -out $R/certs/site-example.crt
          echo ok | sudo tee /srv/syedge/sites/example/current/index.html
          sudo ln -sfn releases/r000001 /opt/syedge/conf/current
          # 运行时不使用 root（设计 0001 D5）：单元以 syedge 运行；私钥按 agent 的方式组可读（0640，组 syedge）
          sudo chown -R syedge:syedge /run/syedge /var/log/syedge /var/cache/syedge
          sudo chgrp -R syedge /opt/syedge/conf && sudo chmod -R g+rX /opt/syedge/conf && sudo chmod 0640 $R/certs/site-example.key
          sudo cp dataplane/packaging/systemd/syedge.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl start syedge || { sudo journalctl -u syedge --no-pager | tail -20 | sed 's/^/::error::/'; exit 1; }
          sudo GITHUB_ACTIONS=true scripts/golden-rename.sh /opt/syedge/sbin/syedge www.example.com
      - name: renderer output through real syedge -t (default, instance and user-mode profiles)
        run: sudo env "PATH=$PATH" GOFLAGS=-mod=vendor go test -count=1 -v -run 'TestRenderSyedgeSyntax$|TestRenderProfileSyedgeSyntax$|TestWebSocketRealSyedge$' ./internal/render/
      - name: brand runtime check (default brand; Server header over HTTP/1.1 and HTTP/2, titles, error page)
        run: sudo scripts/ci/brand-runtime.sh "$(ls dist/syedge-*.tar.gz)" syedge SyEdge
      - name: wrapper hot upgrade with real syedge (single instance and two instances sharing one binary)
        run: sudo env "PATH=$PATH" GOFLAGS=-mod=vendor SYEDGE_BIN=/opt/syedge/sbin/syedge go test -count=1 -v -run 'RealSyedge$' ./internal/wrapper/
      - name: multi-instance and non-root acceptance (P11, design 0001 §10.3)
        # 放在本任务最后：system 阶段会重装本机的 /opt/syedge
        run: sudo env "PATH=$PATH" GOFLAGS=-mod=vendor scripts/ci/p11-acceptance.sh "$(ls dist/syedge-*.tar.gz)" all
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # 账号存储配额满时不阻塞流水线
        with:
          name: syedge-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 3

  dataplane-brand:
    # 定制品牌（设计 0001 第 4 节，BR-01 / BR-02 / D7）：按测试品牌生成改名 patch 并构建数据面，
    # 实测进程标题、-t 输出、HTTP/1.1 与 HTTP/2 的 Server 头（HPACK 编码，字符串扫描看不到）、错误页
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: build deps
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libssl-dev zlib1g-dev
      - name: build sytest / SyTest (OEM test brand)
        run: |
          printf 'BRAND_ID=sytest\nBRAND_PROC=SyTest\nBRAND_PRODUCT="SyTest Gateway"\n' > /tmp/sytest.env
          BRAND_ENV=/tmp/sytest.env GOFLAGS=-mod=vendor dataplane/build-syedge.sh -o dist-brand
      - name: brand runtime check
        run: sudo scripts/ci/brand-runtime.sh "$(ls dist-brand/sytest-*.tar.gz)" sytest SyTest

  dataplane-gm:
    # 国密变体：铜锁（NTLS）静态构建 → 渲染器国密配置过真实 syedge -t → 国密 TLCP 与标准 TLS 握手（同一 443，按 SNI 选证书）。
    # 构建产物按数据面输入缓存，数据面不变时只跑验收（约 1 分钟）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: cache GM build
        id: gm-cache
        uses: actions/cache@v4
        with:
          path: dist-gm
          key: syedge-gm-${{ hashFiles('dataplane/UPSTREAM', 'dataplane/DEPS', 'dataplane/build-syedge.sh', 'dataplane/patches/**', 'dataplane/packaging/html/**', 'scripts/rename-scan.sh', 'docs/NOTICE') }}
      - name: build syedge (Tongsuo, NTLS, static)
        if: steps.gm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist-gm
          KEEP_TLS_CLI="$PWD/dist-gm/tongsuo" dataplane/build-syedge.sh -t tongsuo -o dist-gm
      - name: GM acceptance (syedge -t, TLCP and TLS handshakes)
        run: scripts/ci/gm-handshake.sh dist-gm

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: lint and build web
        run: cd web && pnpm install --frozen-lockfile && pnpm lint && pnpm build
